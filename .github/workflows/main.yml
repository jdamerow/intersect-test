name: example
on: push
jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Greeting!
        run: echo hello world
  test-python-3-13:
    name: Check Python 3.13 on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e .[test]

      - name: Test package
        run: python -m pytest
   test-python-3-14:
     name: Check Python 3.14 on Ubuntu
     runs-on: ubuntu-latest
     steps:
       - name: Checkout code
         uses: actions/checkout@v3

       - uses: actions/setup-python@v4
         with:
          p ython-version: "3.14"

       - name: Install package
         run: python -m pip install -e .[test]

       - name: Test package
         run: python -m pytest
